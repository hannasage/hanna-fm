name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A local Supabase stack from the Supabase CLI. Migrations and the
      # synthetic seed file load on start. Keys stay in the job's memory:
      # the tests read them from `supabase status` and nothing prints them.
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start local Supabase
        run: supabase start > /dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
